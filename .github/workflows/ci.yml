name: CI

# Validation only. Deployments and previews are handled by Vercel, not here.
# No production secrets are required for this build.
on:
  pull_request:
  push:
    branches:
      - main
      - "prod/**"

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest

    # Real PostgreSQL 16 for the durable single-use nonce integration test.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 to match the installed @supabase SDK engines (>=22).
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Install the Chromium build Playwright expects, for the real-browser
      # mobile drawer accessibility test below.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate Phase 1 seed data
        run: npm run seed:validate

      - name: Validate database schema structure
        run: npm run db:schema:validate

      - name: Seed apply/verify safety tests
        run: npm run db:test:safety

      - name: Dashboard RBAC/auth safety tests
        run: npm run db:test:rbac

      # Real PostgreSQL integration test of the single-use nonce register/consume
      # RPCs — applies the migrations to the postgres:16 service container and
      # exercises the register-boundary, ownership, expiry, hash-only, RLS, and a
      # genuine 30-way concurrent-reuse race.
      - name: P04 nonce PostgreSQL integration test
        run: npm run db:test:auth-nonce
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app

      # Real PostgreSQL integration test of the P05 content-management model:
      # role-scoped CRUD, inactive/anon rejection, the owner-only team RPC with
      # self- and final-owner protection, enquiry audit stamping (unforgeable),
      # and FK-protected destructive deletes — anon/authenticated roles only.
      - name: P05 dashboard CRUD PostgreSQL integration test
        run: npm run db:test:crud
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app

      # Real Chromium DOM test of the mobile drawer controller (focus/inert/Escape).
      - name: P04 mobile drawer Chromium accessibility test
        run: npm run test:drawer-a11y

      # Real Chromium test of the confirmation-dialog accessibility pattern used
      # by team management (focus containment, Escape, focus return).
      - name: P05 confirmation dialog Chromium accessibility test
        run: npm run test:confirm-dialog-a11y

      # P05 application-level tests: real validation logic + server-action
      # security guards (re-authorization, unforgeable audit, generic errors).
      - name: P05 dashboard CRUD application tests
        run: npm run test:dashboard-crud

      - name: Client-bundle scanner unit tests (synthetic)
        run: npm run test:scan-bundle

      - name: Dashboard auth/shell safety tests (P04)
        run: npm run test:auth-shell

      - name: Dashboard recovery/invite gate tests (P04)
        run: npm run test:auth-flow

      # Real NextResponse header test of the fail-closed callback cookie helper
      # (Supabase auth/session cookies — incl. chunked + PKCE verifier — become
      # deletions; unrelated cookies untouched; no non-empty session survives).
      - name: P04 callback fail-closed cookie helper test
        run: npm run test:callback-cookie-helper

      - name: Membership bootstrap is read-only by default
        run: npm run db:members:bootstrap

      # Operator invitation tool: production-target validation, redirect pinning,
      # CI-refusal, fail-closed pagination, and no secret/link leakage. No real
      # credentials or network — synthetic identifiers only.
      - name: Operator invitation tool safety tests
        run: npm run test:invite-tool

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Runs AFTER build so it scans the real client bundle. A missing
      # .next/static directory is a FAILURE, not a skipped pass.
      - name: Client bundle secret scan (post-build)
        run: npm run scan:client-bundle

      # Runs AFTER build (needs .next): boots the real app and asserts the actual
      # callback failure response deletes the flow gate + recovery state cookies.
      - name: Callback returned-response cookie deletions (post-build)
        run: npm run test:callback-cookies
