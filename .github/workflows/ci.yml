name: CI

# Validation only. Deployments and previews are handled by Vercel, not here.
# No production secrets are required for this build.
on:
  pull_request:
  push:
    branches:
      - main
      - "prod/**"

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Phase 1 seed data
        run: npm run seed:validate

      - name: Validate database schema structure
        run: npm run db:schema:validate

      - name: Seed apply/verify safety tests
        run: npm run db:test:safety

      - name: Dashboard RBAC/auth safety tests
        run: npm run db:test:rbac

      - name: Membership bootstrap is read-only by default
        run: npm run db:members:bootstrap

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
